<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores Amarillas para Ti 🌻</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 35%, rgba(255,0,128,.55), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(255,0,128,.35), transparent 28%),
        linear-gradient(135deg, #8c0055, #ef007c 45%, #300018);
}

/* Fondo */
#bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* Título */
.header {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    font-size: clamp(20px, 5vw, 34px);
    font-weight: bold;
    text-shadow: 0 0 12px #ffb7df;
}

/* Galaxia */
.card {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: min(92vw, 680px);
    height: min(70vh, 620px);
    min-height: 430px;

    overflow: hidden;
    border-radius: 30px;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(255,225,60,.45),
            transparent 20%
        ),
        radial-gradient(
            circle at 50% 60%,
            rgba(255,190,0,.18),
            transparent 48%
        ),
        #030604;

    box-shadow:
        0 0 35px rgba(255,218,70,.45),
        0 0 80px rgba(255,0,128,.2);

    border: 1px solid rgba(255,255,255,.15);
}

#stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.content {
    position: absolute;
    inset: 0;
}

/* Corazón */
.heart {
    position: absolute;
    left: 50%;
    top: 23%;

    transform: translate(-50%, -50%);

    font-size: clamp(80px, 19vw, 145px);
    line-height: 1;

    color: #fff45c;

    filter: drop-shadow(0 0 12px #fff35a);

    animation: pulse 1.8s ease-in-out infinite;
}

.heart::after {
    content: "Te amo 💛";

    position: absolute;
    left: 50%;
    top: 52%;

    transform: translate(-50%, -50%);

    font-size: 14px;
    white-space: nowrap;

    font-weight: bold;
    color: white;

    text-shadow:
        0 0 8px black,
        0 0 5px #fff;
}

/* Flores */
.flower {
    position: absolute;

    font-size: clamp(38px, 8vw, 70px);

    filter:
        drop-shadow(0 0 8px rgba(255,220,50,.75));

    animation:
        float 3s ease-in-out infinite;
}

.f1 {
    left: 8%;
    top: 28%;
}

.f2 {
    right: 7%;
    top: 28%;
}

.f3 {
    left: 30%;
    bottom: 9%;
}

.f4 {
    right: 22%;
    bottom: 23%;
}

.f5 {
    left: 5%;
    bottom: 25%;
}

.f6 {
    right: 5%;
    bottom: 8%;
}

/* Mensajes */
.message {
    position: absolute;

    font-size: clamp(11px, 2.2vw, 17px);
    font-weight: bold;

    text-shadow:
        0 0 8px black,
        0 0 5px white;
}

.m1 {
    left: 8%;
    top: 43%;
}

.m2 {
    right: 9%;
    top: 43%;
}

.m3 {
    left: 10%;
    bottom: 18%;
}

.m4 {
    right: 9%;
    bottom: 17%;
}

.m5 {
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
}

/* Luz central */
.sun {
    position: absolute;

    left: 50%;
    top: 53%;

    transform: translate(-50%, -50%);

    width: 130px;
    height: 60px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,180,.95),
            rgba(255,225,40,.35),
            transparent 70%
        );

    filter: blur(2px);

    animation: glow 2s infinite alternate;
}

/* Pie */
.footer {
    position: absolute;

    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 3;

    color: white;
    font-size: 13px;

    opacity: .8;
}

/* Animaciones */

@keyframes pulse {

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

}

@keyframes float {

    50% {
        transform:
            translateY(-10px)
            rotate(3deg);
    }

}

@keyframes glow {

    to {
        transform:
            translate(-50%, -50%)
            scale(1.25);

        opacity: .8;
    }

}
</style>
</head>

<script>

/* ==========================================
   FONDO DE CORAZONES ROSADOS
========================================== */

const bg = document.getElementById("bg");

const bctx = bg.getContext("2d");

let bw;
let bh;

let hearts = [];


function resizeBg() {

    bw = bg.width =
        innerWidth * devicePixelRatio;

    bh = bg.height =
        innerHeight * devicePixelRatio;

    bg.style.width =
        innerWidth + "px";

    bg.style.height =
        innerHeight + "px";

    bctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}


function makeHeart() {

    return {

        x: Math.random() * innerWidth,

        y: innerHeight + 30,

        s: 10 + Math.random() * 28,

        vy: .25 + Math.random(),

        alpha: .15 + Math.random() * .5

    };

}


function drawHeart(x, y, s, a) {

    bctx.save();

    bctx.translate(x, y);

    bctx.globalAlpha = a;

    bctx.strokeStyle = "#ff72bd";

    bctx.lineWidth = 2;

    bctx.beginPath();

    bctx.moveTo(0, s * .3);

    bctx.bezierCurveTo(
        -s * 1.2,
        -s * .35,
        -s * .75,
        -s,
        0,
        -s * .35
    );

    bctx.bezierCurveTo(
        s * .75,
        -s,
        s * 1.2,
        -s * .35,
        0,
        s * .3
    );

    bctx.stroke();

    bctx.restore();
}


function animateBg() {

    bctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );

    if (hearts.length < 35) {

        hearts.push(makeHeart());

    }

    hearts.forEach(h => {

        h.y -= h.vy;

        h.x +=
            Math.sin(h.y / 50) * .12;

        drawHeart(
            h.x,
            h.y,
            h.s,
            h.alpha
        );

    });

    hearts =
        hearts.filter(
            h => h.y > -50
        );

    requestAnimationFrame(
        animateBg
    );
}


resizeBg();

addEventListener(
    "resize",
    resizeBg
);

animateBg();
